<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" role="img" aria-labelledby="title desc">
  <title id="title">CDC Event-Driven Architecture</title>
  <desc id="desc">Order insert triggers CDC capture, trigger, and downstream summary update.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>
  <style>
    .frame { fill:#F4FBF6; stroke:#00684A; stroke-width:1.5; }
    .hdr { fill:#00684A; }
    .ht { font:600 12px Arial,sans-serif; fill:#fff; }
    .stage { fill:#fff; stroke:#00684A; stroke-width:1.5; }
    .step { fill:#E8F5E9; stroke:#B8C4C2; stroke-width:1; }
    .event { fill:#fff; stroke:#00684A; stroke-width:1.5; }
    .t { font:600 10px Arial,sans-serif; fill:#001E2B; }
    .b { font:9px Arial,sans-serif; fill:#001E2B; }
    .arr { stroke:#00684A; stroke-width:1.5; fill:none; marker-end:url(#ah); }
  </style>
  <rect x="4" y="4" width="392" height="312" rx="8" class="frame"/>
  <rect x="4" y="4" width="392" height="26" rx="8" class="hdr"/>
  <rect x="4" y="22" width="392" height="8" class="hdr"/>
  <text x="200" y="21" text-anchor="middle" class="ht">CDC EVENT-DRIVEN ARCHITECTURE</text>

  <rect x="145" y="38" width="110" height="32" rx="6" class="event"/>
  <text x="200" y="58" text-anchor="middle" class="t">New Order Arrives</text>

  <line x1="200" y1="72" x2="200" y2="86" class="arr"/>

  <rect x="30" y="88" width="340" height="52" rx="6" class="stage"/>
  <text x="200" y="106" text-anchor="middle" class="t">CDC CAPTURE</text>
  <rect x="50" y="114" width="300" height="20" rx="4" class="step"/>
  <text x="200" y="128" text-anchor="middle" class="b">Insert into orders collection</text>

  <line x1="200" y1="142" x2="200" y2="156" class="arr"/>

  <rect x="30" y="158" width="340" height="52" rx="6" class="stage"/>
  <text x="200" y="176" text-anchor="middle" class="t">CDC TRIGGER</text>
  <rect x="50" y="184" width="300" height="20" rx="4" class="step"/>
  <text x="200" y="198" text-anchor="middle" class="b">update_daily_summary() called</text>

  <line x1="200" y1="212" x2="200" y2="226" class="arr"/>

  <rect x="30" y="228" width="340" height="72" rx="6" class="stage"/>
  <text x="200" y="246" text-anchor="middle" class="t">DOWNSTREAM PROCESSING</text>
  <rect x="50" y="254" width="300" height="38" rx="4" class="step"/>
  <text x="200" y="268" text-anchor="middle" class="b">Update daily_summary</text>
  <text x="200" y="282" text-anchor="middle" class="b">totalOrders, totalQuantity, per-customer</text>
</svg>
