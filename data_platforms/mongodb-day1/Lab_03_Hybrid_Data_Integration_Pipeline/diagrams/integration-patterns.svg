<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Integration Pipeline</title>
  <desc id="desc">Batch, API, and CDC patterns feeding MongoDB Atlas.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>
  <style>
    .frame { fill:#F4FBF6; stroke:#00684A; stroke-width:1.5; }
    .hdr { fill:#00684A; }
    .ht { font:600 13px Arial,sans-serif; fill:#fff; }
    .box { fill:#fff; stroke:#00684A; stroke-width:1.5; }
    .atlas { fill:#E8F5E9; stroke:#00684A; stroke-width:1.5; stroke-dasharray:4 3; }
    .t { font:600 10px Arial,sans-serif; fill:#001E2B; }
    .b { font:9px Arial,sans-serif; fill:#5C6C75; }
    .c { font:600 9px Arial,sans-serif; fill:#00684A; }
    .arr { stroke:#00684A; stroke-width:1.5; fill:none; marker-end:url(#ah); }
  </style>
  <rect x="4" y="4" width="552" height="242" rx="8" class="frame"/>
  <rect x="4" y="4" width="552" height="28" rx="8" class="hdr"/>
  <rect x="4" y="24" width="552" height="8" class="hdr"/>
  <text x="280" y="23" text-anchor="middle" class="ht">HYBRID INTEGRATION PIPELINE</text>

  <rect x="20" y="40" width="160" height="58" rx="6" class="box"/>
  <text x="100" y="58" text-anchor="middle" class="t">BATCH</text>
  <text x="100" y="72" text-anchor="middle" class="b">Load everything at once</text>
  <text x="100" y="86" text-anchor="middle" class="c">CSV historical data</text>

  <rect x="200" y="40" width="160" height="58" rx="6" class="box"/>
  <text x="280" y="58" text-anchor="middle" class="t">API</text>
  <text x="280" y="72" text-anchor="middle" class="b">Fetch on demand</text>
  <text x="280" y="86" text-anchor="middle" class="c">External enrichment</text>

  <rect x="380" y="40" width="160" height="58" rx="6" class="box"/>
  <text x="460" y="58" text-anchor="middle" class="t">CDC</text>
  <text x="460" y="72" text-anchor="middle" class="b">React to changes</text>
  <text x="460" y="86" text-anchor="middle" class="c">Real-time orders</text>

  <line x1="100" y1="100" x2="100" y2="118" class="arr"/>
  <line x1="280" y1="100" x2="280" y2="118" class="arr"/>
  <line x1="460" y1="100" x2="460" y2="118" class="arr"/>

  <rect x="40" y="122" width="480" height="112" rx="8" class="atlas"/>
  <text x="280" y="140" text-anchor="middle" class="t">MONGODB ATLAS</text>

  <rect x="60" y="152" width="130" height="66" rx="6" class="box"/>
  <text x="125" y="172" text-anchor="middle" class="t">orders</text>
  <text x="125" y="188" text-anchor="middle" class="b">Batch + CDC</text>

  <line x1="192" y1="185" x2="208" y2="185" class="arr"/>

  <rect x="210" y="152" width="140" height="66" rx="6" class="box"/>
  <text x="280" y="172" text-anchor="middle" class="t">enriched_orders</text>
  <text x="280" y="188" text-anchor="middle" class="b">+ name, tier</text>

  <rect x="370" y="152" width="130" height="66" rx="6" class="box"/>
  <text x="435" y="172" text-anchor="middle" class="t">daily_summary</text>
  <text x="435" y="188" text-anchor="middle" class="b">CDC updates</text>
</svg>
