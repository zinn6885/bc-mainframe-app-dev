<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" role="img" aria-labelledby="title desc">
  <title id="title">Source to Target Mapping</title>
  <desc id="desc">CSV fields mapped to MongoDB document structure.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>
  <style>
    .frame { fill:#F4FBF6; stroke:#00684A; stroke-width:1.5; }
    .hdr { fill:#00684A; }
    .ht { font:600 13px Arial,sans-serif; fill:#fff; }
    .col { fill:#fff; stroke:#B8C4C2; stroke-width:1.2; }
    .ct { font:600 11px Arial,sans-serif; fill:#001E2B; }
    .f { font:10px Consolas,monospace; fill:#001E2B; }
    .arr { stroke:#00684A; stroke-width:1.2; fill:none; marker-end:url(#ah); }
  </style>
  <rect x="4" y="4" width="552" height="272" rx="8" class="frame"/>
  <rect x="4" y="4" width="552" height="28" rx="8" class="hdr"/>
  <rect x="4" y="24" width="552" height="8" class="hdr"/>
  <text x="280" y="23" text-anchor="middle" class="ht">SOURCE TO TARGET MAPPING</text>
  <text x="140" y="48" text-anchor="middle" class="ct">Oracle / CSV</text>
  <text x="420" y="48" text-anchor="middle" class="ct">MongoDB Atlas</text>
  <rect x="24" y="58" width="200" height="204" rx="6" class="col"/>
  <text x="36" y="78" class="f">customers.csv</text>
  <text x="36" y="98" class="f">customer_id</text>
  <text x="36" y="116" class="f">name</text>
  <text x="36" y="134" class="f">email</text>
  <text x="36" y="152" class="f">state</text>
  <text x="36" y="170" class="f">phone</text>
  <text x="36" y="188" class="f">signup_date</text>
  <rect x="336" y="58" width="200" height="204" rx="6" class="col"/>
  <text x="348" y="78" class="f">migration_db.customers</text>
  <text x="348" y="98" class="f">customerId (int)</text>
  <text x="348" y="116" class="f">name (string)</text>
  <text x="348" y="134" class="f">contact.email</text>
  <text x="348" y="152" class="f">contact.phone</text>
  <text x="348" y="170" class="f">address.state</text>
  <text x="348" y="188" class="f">signupDate (Date)</text>
  <text x="348" y="206" class="f">dataQuality {...}</text>
  <line x1="228" y1="98" x2="330" y2="98" class="arr"/>
  <line x1="228" y1="116" x2="330" y2="116" class="arr"/>
  <line x1="228" y1="134" x2="330" y2="134" class="arr"/>
  <line x1="228" y1="152" x2="330" y2="170" class="arr"/>
  <line x1="228" y1="170" x2="330" y2="152" class="arr"/>
  <line x1="228" y1="188" x2="330" y2="188" class="arr"/>
</svg>
