<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Lab 1 VPC Architecture</title>
  <desc>Custom VPC with public, private, and firewall subnets, IGW, NAT Gateway, and AWS Network Firewall.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="700" height="400" rx="8" fill="#F4FBF6" stroke="#00684A" stroke-width="2"/>
  <rect x="10" y="10" width="700" height="36" rx="8" fill="#00684A"/>
  <text x="360" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="13" font-weight="600">Lab1-VPC - 10.0.0.0/16</text>

  <rect x="28" y="52" width="320" height="130" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="188" y="72" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Public-Subnet-A (10.0.1.0/24) - us-east-1a</text>
  <rect x="48" y="84" width="120" height="48" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="108" y="104" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Lab1-IGW</text>
  <text x="108" y="120" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Internet Gateway</text>
  <rect x="188" y="84" width="140" height="48" rx="4" fill="#FFFFFF" stroke="#00684A" stroke-width="1.2"/>
  <text x="258" y="104" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Lab1-NAT</text>
  <text x="258" y="120" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">NAT Gateway + EIP</text>
  <text x="188" y="148" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Public-RT: 0.0.0.0/0 -&gt; IGW</text>

  <rect x="368" y="52" width="324" height="130" rx="6" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5"/>
  <text x="530" y="72" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Firewall-Subnet-A (10.0.3.0/24) - us-east-1a</text>
  <rect x="408" y="84" width="244" height="56" rx="4" fill="#FFFFFF" stroke="#00684A" stroke-width="1.2"/>
  <text x="530" y="106" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Lab1-Firewall</text>
  <text x="530" y="122" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">AWS Network Firewall</text>
  <text x="530" y="148" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Firewall-RT: local routes only</text>

  <rect x="28" y="200" width="664" height="120" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="360" y="220" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Private-Subnet-B (10.0.2.0/24) - us-east-1b</text>
  <rect x="248" y="236" width="224" height="56" rx="4" fill="#FFFFFF" stroke="#00684A" stroke-width="1.2"/>
  <text x="360" y="258" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Web Servers (future)</text>
  <text x="360" y="274" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Web-SG + Web-Subnet-NACL</text>
  <text x="360" y="302" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Private-RT: 0.0.0.0/0 -&gt; NAT Gateway</text>

  <rect x="28" y="340" width="664" height="52" rx="6" fill="#FFFFFF" stroke="#00684A" stroke-width="1.2"/>
  <text x="360" y="362" text-anchor="middle" fill="#001E2B" font-family="Arial,sans-serif" font-size="11" font-weight="600">Internet</text>
  <text x="360" y="378" text-anchor="middle" fill="#5C6C75" font-family="Arial,sans-serif" font-size="9">Public via IGW | Private outbound via NAT</text>

  <line x1="108" y1="132" x2="108" y2="340" stroke="#00684A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="258" y1="132" x2="360" y2="200" stroke="#00684A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
